name: Build APK Daily Control Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project folders
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/core/app_theme.dart
          test -f lib/core/demo_data.dart
          test -f lib/widgets/ui.dart
          test -f lib/screens/dashboard.dart
          test -f test/widget_test.dart

      - name: Generate Android project
        run: flutter create --platforms=android --org com.kemuninghub .

      - name: Ensure Android release has INTERNET permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path('android/app/src/main/AndroidManifest.xml')
          if not p.exists():
              raise SystemExit('Missing Android main manifest after flutter create')
          content = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in content:
              manifest = re.search(r'<manifest\b[^>]*>', content, re.DOTALL)
              if not manifest:
                  raise SystemExit('Cannot locate opening manifest tag')
              content = content[:manifest.end()] + (
                  '\n    <uses-permission android:name="android.permission.INTERNET" />'
              ) + content[manifest.end():]
              p.write_text(content, encoding='utf-8')
          ET.parse(p)
          if 'android.permission.INTERNET' not in p.read_text(encoding='utf-8'):
              raise SystemExit('INTERNET permission not applied')
          print('Android RELEASE manifest: INTERNET permission confirmed')
          PY

      - name: Install dependencies
        run: flutter pub get

      # Only analyze actual app/test sources. Old accidental *.dart files in
      # repository root should not be analyzed as if they were Flutter pages.
      # Keep compile errors fatal, but don't fail for temporary lint warnings.
      - name: Analyze app source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Analyze widget tests
        run: flutter analyze --no-fatal-infos --no-fatal-warnings test

      - name: Run unit tests
        run: flutter test --reporter expanded

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyControlMobile-Operasional-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
